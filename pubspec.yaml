name: auth_flow_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Dependency Injection
  get_it: ^9.3.0

  # Functional Programming & Error Handling
  dartz: ^0.10.1

  # UI Components
  cupertino_icons: ^2.0.0

  # Image Picker
  image_picker: ^1.2.4

  # HTTP
  http: ^1.6.0

  # Backend Services
  supabase_flutter: ^2.18.3

  # .ENV Configuration Loading
  flutter_dotenv: ^6.0.2

  # PIN / OTP Input
  pinput: ^7.0.0
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - config.env